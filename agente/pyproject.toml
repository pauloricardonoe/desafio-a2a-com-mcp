[project]
name = "agente-central-de-salas"
version = "1.0.0"
description = "Agente A2A que reserva salas, host MCP por dentro"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agente_central*"]
