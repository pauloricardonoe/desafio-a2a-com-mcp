[project]
name = "central-de-salas-mcp"
version = "1.0.0"
description = "Servidor MCP das salas de reuniao da Hill Valley Tech"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["servidor_mcp*"]
